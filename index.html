<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fer-Vet · Eines</title>
<style>
  :root { --bg:#f4f6f4; --card:#fff; --text:#1c2330; --muted:#5b6472; --verd:#4f9f41; --linia:#d9dee6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --card:#1d232b; --text:#e8ecf1; --muted:#9aa5b3; --linia:#2d3640; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  main { width:100%; max-width:520px; }
  h1 { font-size:30px; margin:0 0 4px; letter-spacing:-1px; }
  h1 span { color:var(--verd); }
  p.sub { margin:0 0 24px; color:var(--muted); }
  a.eina { display:block; background:var(--card); border:1px solid var(--linia); border-left:5px solid var(--verd); border-radius:8px; padding:16px 18px; margin-bottom:12px; color:inherit; text-decoration:none; }
  a.eina:hover { border-color:var(--verd); }
  a.eina b { display:block; font-size:18px; }
  a.eina small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>fer<span>/</span>vet</h1>
  <p class="sub">Eines internes</p>
  <a class="eina" href="rutes/"><b>Rutes</b><small>Ordenació de rutes per distància des de la central</small></a>
  <a class="eina" href="ofertes/"><b>Ofertes</b><small>Generador d'ofertes als ramaders</small></a>
</main>
</body>
</html>
